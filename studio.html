<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由设计工作台</title>
<link rel="stylesheet" href="vendor/grapesjs/grapes.min.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#263d4c;background:#f3f6f7}header{display:flex;gap:12px;align-items:center;padding:14px 20px;background:white;border-bottom:1px solid #dce5e8;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}a{color:#365d85}button,input,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:235px minmax(320px,1fr) 260px;min-height:calc(100vh - 62px)}.panel{padding:18px;background:#fff;overflow:auto}.left{border-right:1px solid #dce5e8}.right{border-left:1px solid #dce5e8}h2{font-size:16px;margin:0 0 10px}p{line-height:1.6;color:#617683}.hint{font-size:13px}.blocks{display:grid;gap:8px}.blocks button,.action{padding:11px;border:1px solid #cddce0;border-radius:8px;background:white;color:#263d4c;text-align:left}.blocks button:hover,.action:hover{background:#edf4f5}.canvas{padding:18px;min-width:0}.canvas-title{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.canvas-title p{margin:0 0 12px}.canvas-shell{height:75vh;min-height:550px;background:white;border:1px solid #dce5e8;border-radius:10px;overflow:hidden}#gjs{height:100%}.gjs-editor,.gjs-cv-canvas{background:#fff}.gjs-cv-canvas{width:100%;height:100%;top:0}.gjs-pn-panels{display:none}.fields label{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:8px;margin:12px 0}.fields input,.fields select{width:100%;min-width:0;padding:8px;border:1px solid #cddce0;border-radius:6px}.fields input[type=color]{height:38px;padding:2px}.fields button{width:100%;text-align:center;margin-top:8px}.note{padding:10px;background:#f2f7f8;border-radius:8px}.templates{display:grid;gap:8px;margin:12px 0}.template{display:grid;gap:7px;padding:10px;border:1px solid #dce5e8;border-radius:8px;cursor:pointer}.template:has(input:checked){border:2px solid #526a91;background:#f2f5fa}.template-head{display:flex;align-items:center;gap:7px;font-weight:600}.template input{accent-color:#526a91}.sample{display:inline-flex;justify-self:start;gap:3px;padding:3px;border:1px solid #526a91;border-radius:999px;background:white;font-size:12px}.sample span{padding:5px 10px;border-radius:999px}.sample span:first-child{background:#526a91;color:white}.sample.soft{background:#edf1f4;border-color:transparent}.sample.plain{border-color:transparent}.sample.outline span:first-child{background:white;color:#526a91;box-shadow:inset 0 0 0 2px #526a91}.sample.light span:first-child{background:#dce5f1;color:#273d4c}.sample.square,.sample.square span{border-radius:6px}.icons{display:flex;gap:6px;flex-wrap:wrap}.icons button{min-width:42px;height:42px;border:1px solid #cddce0;border-radius:7px;background:#fff;font-size:18px}.status{font-size:12px;color:#526d79}.mobile-note{display:none}@media(max-width:850px){.layout{display:flex;flex-direction:column}.panel{border:0;border-bottom:1px solid #dce5e8}.canvas{order:1}.right{order:2}.left{order:0}.canvas-shell{height:520px;min-height:0}.mobile-note{display:block}.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><h1>自由设计工作台 <small>· 试用版</small></h1><a href="index.html">返回原设计页</a><button class="action" id="save">保存草稿</button><button class="action" id="reset">恢复示例</button></header>
<div class="layout"><section class="panel left"><h2>选择按钮组样式</h2><p class="hint">先选择喜欢的样式，再添加到画布。添加后可点击外框或按钮调整参数。</p><div class="templates" role="radiogroup" aria-label="按钮组样式">
<label class="template"><span class="template-head"><input type="radio" name="preset" value="solid" checked>描边胶囊</span><span class="sample"><span>主线</span><span>并行</span></span></label>
<label class="template"><span class="template-head"><input type="radio" name="preset" value="soft">浅底胶囊</span><span class="sample soft"><span>主线</span><span>并行</span></span></label>
<label class="template"><span class="template-head"><input type="radio" name="preset" value="plain">无框胶囊</span><span class="sample plain"><span>主线</span><span>并行</span></span></label>
<label class="template"><span class="template-head"><input type="radio" name="preset" value="outline">描边选中</span><span class="sample outline"><span>主线</span><span>并行</span></span></label>
<label class="template"><span class="template-head"><input type="radio" name="preset" value="light">浅色选中</span><span class="sample light"><span>主线</span><span>并行</span></span></label>
<label class="template"><span class="template-head"><input type="radio" name="preset" value="square">圆角方形</span><span class="sample square"><span>主线</span><span>并行</span></span></label>
</div><button class="action" data-add="preset" style="width:100%;text-align:center">＋ 添加所选样式</button><h2 style="margin-top:24px">添加其他模块</h2><p class="hint">点击添加到画布，再点击画布中的内容进行调整。</p><div class="blocks"><button data-add="box">＋ 功能区外框</button><button data-add="card">＋ 信息卡片</button><button data-add="button">＋ 单个按钮</button></div><h2 style="margin-top:24px">添加矢量图标</h2><p class="hint">先选中一个容器，再点击图标添加。</p><div class="icons"><button data-icon="home" aria-label="添加首页图标">⌂</button><button data-icon="clock" aria-label="添加时间图标">◷</button><button data-icon="calendar" aria-label="添加日历图标">▦</button><button data-icon="star" aria-label="添加星形图标">☆</button></div><p class="note hint">图标是可缩放的 SVG 矢量图。设计保存在本浏览器，不会改变时间记录 App。</p></section>
<section class="canvas"><div class="canvas-title"><div><h2>设计画布</h2><p class="hint">点击要调整的内容，右侧会显示它的设置。双击文字可编辑。</p></div><span id="status" class="status" role="status"></span></div><div class="canvas-shell"><div id="gjs"></div></div><p class="mobile-note hint">手机上调整面板在画布下方。</p></section>
<aside class="panel right"><h2>选中内容的设置</h2><p id="selection" class="hint">请先点击画布中的外框、按钮或图标。</p><div id="fields" class="fields" hidden><label>宽度（px）<input id="width" type="number" min="0" max="1000" placeholder="自动"></label><label>高度（px）<input id="height" type="number" min="0" max="1000" placeholder="自动"></label><label>圆角（px）<input id="radius" type="number" min="0" max="500" placeholder="0"></label><label>内边距（px）<input id="padding" type="number" min="0" max="100" placeholder="0"></label><label>背景颜色<input id="background" type="color" value="#ffffff"></label><label>文字颜色<input id="color" type="color" value="#273d4c"></label><button class="action" id="remove">删除选中内容</button></div><p class="note hint">点选按钮可分别调整；点选外框可调整整个功能区。当前试用版尚未连接原统计预览。</p></aside></div>
<script src="vendor/grapesjs/grapes.min.js"></script><script>
(()=>{const key='timebook-free-studio-v1',status=document.querySelector('#status');const initial=`<div style="padding:24px;background:#f5f7f8;min-height:500px"><div style="padding:20px;border:1px solid #dce5e8;border-radius:16px;background:#fff"><h2 style="font-size:18px;color:#273d4c">时间结构</h2><div style="display:inline-flex;padding:4px;gap:4px;border:1px solid #002fa7;border-radius:999px"><button class="btn btn-primary" style="border-radius:999px">主线</button><button class="btn btn-ghost" style="border-radius:999px">并行</button></div><p style="color:#637886">双击文字修改内容，点击按钮或外框调整样式。</p></div></div>`;
const editor=grapesjs.init({container:'#gjs',height:'100%',storageManager:false,panels:{defaults:[]},canvas:{styles:['vendor/daisyui/daisyui.css']},components:initial});
try{const data=JSON.parse(localStorage.getItem(key));if(data)editor.loadProjectData(data)}catch(e){status.textContent='草稿读取失败，已显示示例'}
const icons={home:'<path d="M3 10 12 3l9 7v10h-6v-6H9v6H3z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>'};
const snippets={box:'<div style="min-height:100px;padding:20px;border:1px solid #aabac2;border-radius:12px;background:#ffffff">双击输入内容</div>',buttons:'<div style="display:inline-flex;gap:4px;padding:4px;border:1px solid #002fa7;border-radius:999px"><button class="btn btn-primary" style="border-radius:999px">选项一</button><button class="btn btn-ghost" style="border-radius:999px">选项二</button></div>',card:'<div class="card bg-base-100" style="padding:20px;border:1px solid #dce5e8;border-radius:16px"><h3>卡片标题</h3><p>双击修改说明文字</p></div>',button:'<button class="btn btn-primary">按钮</button>'};
function presetMarkup(name){const round=name==='square'?'6px':'999px';const border=['soft','plain'].includes(name)?'transparent':'#526a91';const bg=name==='soft'?'#edf1f4':'#ffffff';let active='background:#526a91;color:#ffffff;';if(name==='outline')active='background:#ffffff;color:#526a91;box-shadow:inset 0 0 0 2px #526a91;';if(name==='light')active='background:#dce5f1;color:#273d4c;';return `<div style="display:inline-flex;gap:3px;padding:3px;border:1px solid ${border};border-radius:${round};background:${bg}"><button style="min-width:60px;min-height:36px;padding:6px 12px;border:0;border-radius:${round};${active}">主线</button><button style="min-width:60px;min-height:36px;padding:6px 12px;border:0;border-radius:${round};background:transparent;color:#273d4c">并行</button></div>`;}
function add(html){let selected=editor.getSelected();if(!selected||!selected.get('droppable')||['button','svg','path'].includes(selected.get('tagName'))) selected=editor.getWrapper();selected.append(html);status.textContent='已添加到画布';}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add==='preset'?presetMarkup(document.querySelector('input[name=preset]:checked').value):snippets[b.dataset.add]));document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>add(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#526a91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[b.dataset.icon]}</svg>`));
const fields=document.querySelector('#fields'),selection=document.querySelector('#selection');const map={width:'width',height:'height',radius:'border-radius',padding:'padding',background:'background-color',color:'color'};function refresh(){const c=editor.getSelected();fields.hidden=!c;if(!c){selection.textContent='请先点击画布中的外框、按钮或图标。';return}selection.textContent='已选中：'+(c.get('tagName')||'内容');const s=c.getStyle();for(const [id,prop] of Object.entries(map)){const v=s[prop]||'';document.getElementById(id).value=['background','color'].includes(id)?(/^#[0-9a-f]{6}$/i.test(v)?v:(id==='background'?'#ffffff':'#273d4c')):(parseFloat(v)||'')}}editor.on('component:selected',refresh);editor.on('component:deselected',refresh);for(const [id,prop] of Object.entries(map))document.getElementById(id).addEventListener('input',e=>{const c=editor.getSelected();if(!c)return;const v=e.target.value;c.addStyle({[prop]:['background','color'].includes(id)?v:(v===''?'':v+'px')})});
document.querySelector('#remove').onclick=()=>{const c=editor.getSelected();if(c&&c!==editor.getWrapper()){c.remove();refresh()}};document.querySelector('#save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(editor.getProjectData()));status.textContent='草稿已保存到本浏览器'}catch(e){status.textContent='保存失败，请检查浏览器存储权限'}};document.querySelector('#reset').onclick=()=>{if(confirm('恢复示例会替换当前画布，确定继续吗？')){editor.setComponents(initial);localStorage.removeItem(key);status.textContent='已恢复示例'}};
})();</script></body></html>
