<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自由画布 · 设计工作台</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#263d4c;background:#edf2f4}button,input,select,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid #d9e3e6;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}a{color:#345f85}.action,button{border:1px solid #cfdee1;border-radius:7px;padding:9px;background:#fff;color:#263d4c}.layout{display:grid;grid-template-columns:200px minmax(300px,1fr) 280px;align-items:start}.panel{padding:16px;background:white;min-width:0}h2{font-size:15px;margin:0 0 12px}.items{display:grid;grid-template-columns:1fr 1fr;gap:7px}.items button{min-height:43px}.hint{color:#627883;line-height:1.6;font-size:12px}.canvas{padding:14px;min-width:0}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar label{display:flex;align-items:center;gap:5px}.toolbar input{width:68px}input,select,textarea{border:1px solid #c8d9df;border-radius:6px;padding:7px;min-width:0;max-width:100%}.board-wrap{overflow:auto;max-height:78vh;background:#d9e3e7;padding:16px;border-radius:10px;text-align:center}#canvas{display:inline-block;line-height:0;background:#fff;box-shadow:0 2px 12px #29404d22;touch-action:none}.fields label{display:grid;grid-template-columns:1fr 95px;align-items:center;gap:8px;margin:8px 0}.fields input,.fields select{width:100%}.fields input[type=color]{height:38px;padding:2px}details{border-top:1px solid #e0e9eb;padding:10px 0}summary{font-weight:600;cursor:pointer}.primary{background:#526a91;color:#fff;width:100%}.secondary{width:100%;margin-top:7px}textarea{width:100%;height:135px;resize:vertical;font-size:12px;line-height:1.5}.status{min-height:20px;color:#3b6e63}.selected{font-weight:600}.empty{color:#627883}@media(max-width:850px){.layout{display:flex;flex-direction:column}.panel,.canvas{width:100%}.items{grid-template-columns:repeat(4,1fr)}.board-wrap{max-height:65vh}header{gap:7px}}
</style></head><body><header><h1>自由画布 <small>· 第一稿</small></h1><a href="studio.html">返回原工作台</a><button id="save">保存草稿</button><button id="clear">清空画板</button></header>
<div class="layout"><aside class="panel"><h2>添加模块</h2><div class="items"><button data-add="frame">外框</button><button data-add="button">按钮</button><button data-add="group">按钮组</button><button data-add="text">文字</button><button data-add="chart">圆环图</button><button data-add="icon">图标</button></div><p class="hint">点击添加；拖动对象可移动，靠近边缘或中心时自动对齐。</p><h2>选择方式</h2><p class="hint">在空白处按住左键拖出选择框，碰到的元素都会选中。按住 Shift 点击可增减选择。手机可在空白处拖动框选。</p></aside>
<main class="canvas"><div class="toolbar"><label>画板 <select id="device"><option value="384,832">S24 Ultra 参考</option><option value="360,780">窄手机参考</option><option value="390,844">常见手机参考</option><option value="412,915">宽手机参考</option><option value="custom">自定义</option></select></label><label>宽 <input id="boardW" type="number" value="384" min="240" max="1600"></label><label>高 <input id="boardH" type="number" value="832" min="240" max="2400"></label><button id="resize">应用尺寸</button><button id="selectAll">全选</button><button id="delete">删除所选</button></div><div class="board-wrap"><div id="canvas"></div></div><p class="hint">尺寸为网页逻辑像素参考值。系统显示缩放和浏览器工具栏可能改变真实可用大小。画板可滚动；电脑可按住 Shift 多选。</p></main>
<aside class="panel"><h2>右侧设置</h2><p id="selection" class="selected">尚未选择内容</p><div id="fields" class="fields" hidden><details open><summary>内容与尺寸</summary><label>名称<input id="name"></label><label>显示文字<input id="label"></label><label>左边位置<input id="x" type="number"></label><label>上边位置<input id="y" type="number"></label><label>宽度<input id="width" type="number" min="20" max="1600"></label><label>高度<input id="height" type="number" min="20" max="2400"></label><label id="count-row" hidden>按钮数量<select id="count"><option>2</option><option>3</option><option>4</option></select></label></details><details open><summary>外观</summary><label>背景颜色<input id="fill" type="color"></label><label>文字颜色<input id="color" type="color"></label><label>边框颜色<input id="stroke" type="color"></label><label>圆角<input id="radius" type="number" min="0" max="999"></label><label>字号<input id="fontSize" type="number" min="8" max="100"></label></details></div><p id="multi" class="hint" hidden>已选择多个元素；参数摘要包含每个元素。</p><h2>所选设计参数</h2><textarea id="summary" readonly aria-label="所选设计参数"></textarea><button id="copy" class="primary">复制所选参数给 AI</button><p id="status" role="status" class="status"></p><p class="hint">第一稿中的元素是独立对象，外框暂不自动包含其他元素。图标和圆环图为示例，手机画板与参数仅用于设计，不连接时间记录数据。</p></aside></div>
<script src="vendor/konva/konva.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id), key='timebook-canvas-v1';let W=384,H=832,scale=1,selected=[],start=null,dragOrigin=null;const stage=new Konva.Stage({container:'canvas',width:W,height:H}),layer=new Konva.Layer(),guideLayer=new Konva.Layer({listening:false});stage.add(layer,guideLayer);const bg=new Konva.Rect({x:0,y:0,width:W,height:H,fill:'#fff',name:'background'});layer.add(bg);const transformer=new Konva.Transformer({rotateEnabled:false,anchorSize:8,borderStroke:'#367fa2',anchorStroke:'#367fa2',boundBoxFunc:(old,b)=>b.width<20||b.height<20?old:b});layer.add(transformer);const marquee=new Konva.Rect({fill:'rgba(70,140,190,.14)',stroke:'#3684a7',strokeWidth:1,visible:false,listening:false});guideLayer.add(marquee);
const names={frame:'功能区外框',button:'按钮',group:'按钮组',text:'文字',chart:'圆环图',icon:'图标'};let seq=0;
function render(g){g.destroyChildren();const d=g.getAttrs(),w=d.width,h=d.height; if(d.type==='chart'){g.add(new Konva.Circle({x:w/2,y:h/2,radius:Math.min(w,h)*.38,stroke:'#dce5ed',strokeWidth:Math.min(w,h)*.19}));g.add(new Konva.Arc({x:w/2,y:h/2,innerRadius:Math.min(w,h)*.285,outerRadius:Math.min(w,h)*.475,angle:125,rotation:-90,fill:d.fill}));g.add(new Konva.Text({x:0,y:h/2-9,width:w,text:d.label||'24 小时',align:'center',fontSize:d.fontSize,fill:d.color}));}else if(d.type==='icon'){g.add(new Konva.Circle({x:w/2,y:h/2,radius:Math.min(w,h)*.32,stroke:d.stroke,strokeWidth:2}));g.add(new Konva.Line({points:[w/2,h*.28,w/2,h/2,w*.66,h*.58],stroke:d.stroke,strokeWidth:2,lineCap:'round'}));}else{g.add(new Konva.Rect({width:w,height:h,fill:d.fill,stroke:d.stroke,strokeWidth:1,cornerRadius:d.radius}));if(d.type==='group'){const n=d.count||2,spacing=4,inner=(w-8-(n-1)*spacing)/n;for(let i=0;i<n;i++){const x=4+i*(inner+spacing);if(i===0)g.add(new Konva.Rect({x,y:4,width:inner,height:h-8,fill:'#526a91',cornerRadius:Math.min(d.radius,(h-8)/2)}));g.add(new Konva.Text({x,y:h/2-d.fontSize/2,width:inner,text:(d.label||'主线,并行').split(/[,，]/)[i]||'选项'+(i+1),align:'center',fontSize:d.fontSize,fill:i===0?'#fff':d.color}));}}else g.add(new Konva.Text({x:5,y:Math.max(0,(h-d.fontSize)/2),width:w-10,text:d.label||'',align:d.type==='frame'?'left':'center',fontSize:d.fontSize,fill:d.color}));}g.getChildren().forEach(c=>c.listening(false));}
function make(d){const g=new Konva.Group({id:d.id||'item-'+(++seq),name:'item',type:d.type,itemName:d.itemName||names[d.type],x:d.x??30,y:d.y??30,width:d.width,height:d.height,fill:d.fill,color:d.color,stroke:d.stroke,radius:d.radius,fontSize:d.fontSize,label:d.label||'',count:d.count||2,draggable:true});render(g);layer.add(g);g.on('click tap',e=>{e.cancelBubble=true;if(e.evt.shiftKey){setSelected(selected.includes(g)?selected.filter(n=>n!==g):[...selected,g])}else if(!selected.includes(g))setSelected([g]);});g.on('dragstart',()=>{if(!selected.includes(g))setSelected([g]);dragOrigin=selected.map(n=>({n,x:n.x(),y:n.y()}))});g.on('dragmove',()=>{if(dragOrigin){const own=dragOrigin.find(v=>v.n===g),dx=g.x()-own.x,dy=g.y()-own.y;dragOrigin.forEach(v=>{if(v.n!==g)v.n.position({x:v.x+dx,y:v.y+dy})});if(selected.length===1)snap(g);guideLayer.batchDraw();updateSummary()}});g.on('dragend',()=>{dragOrigin=null;guideLayer.find('.guide').forEach(x=>x.destroy());guideLayer.batchDraw();refresh()});g.on('transformend',()=>{const sx=g.scaleX(),sy=g.scaleY();g.width(Math.max(20,g.width()*sx));g.height(Math.max(20,g.height()*sy));g.scale({x:1,y:1});render(g);refresh()});transformer.moveToTop();return g;}
function snap(g){guideLayer.find('.guide').forEach(x=>x.destroy());const threshold=5/scale,targetsX=[0,W/2,W],targetsY=[0,H/2,H];layer.find('.item').forEach(n=>{if(n===g)return;targetsX.push(n.x(),n.x()+n.width()/2,n.x()+n.width());targetsY.push(n.y(),n.y()+n.height()/2,n.y()+n.height())});for(const [axis,targets,size] of [['x',targetsX,g.width()],['y',targetsY,g.height()]]){let best=null;for(const target of targets)for(const offset of [0,size/2,size]){const delta=target-(g[axis]()+offset);if(Math.abs(delta)<threshold&&(!best||Math.abs(delta)<Math.abs(best.delta)))best={delta,target}}if(best){g[axis](g[axis]()+best.delta);guideLayer.add(new Konva.Line({name:'guide',points:axis==='x'?[best.target,0,best.target,H]:[0,best.target,W,best.target],stroke:'#e572a7',strokeWidth:1/scale,dash:[4/scale,3/scale],listening:false}))}}}
function setSelected(a){selected=a;transformer.nodes(a);refresh();layer.batchDraw()}function updateSummary(){const out=selected.map(g=>{const a=g.getAttrs();return {类型:names[a.type],名称:a.itemName,位置:{左:Math.round(g.x()),上:Math.round(g.y())},尺寸:{宽:Math.round(g.width()*g.scaleX()),高:Math.round(g.height()*g.scaleY())},文字:a.label,按钮数量:a.type==='group'?a.count:undefined,背景:a.fill,文字颜色:a.color,边框颜色:a.stroke,圆角:a.radius,字号:a.fontSize}});$('summary').value=out.length?'设计画板：'+W+' × '+H+' 逻辑像素\n已选 '+out.length+' 项；位置以画板左上角为原点。\n'+JSON.stringify(out,null,2):'请选择一个或多个元素。'}
function refresh(){const one=selected.length===1,g=selected[0];$('selection').textContent=selected.length?'已选中 '+selected.length+' 项'+(one?'：'+g.getAttr('itemName'):''):'尚未选择内容';$('fields').hidden=!one;$('multi').hidden=selected.length<2;if(one){const a=g.getAttrs();for(const [id,v] of Object.entries({name:a.itemName,label:a.label,x:Math.round(g.x()),y:Math.round(g.y()),width:Math.round(g.width()),height:Math.round(g.height()),fill:a.fill,color:a.color,stroke:a.stroke,radius:a.radius,fontSize:a.fontSize,count:a.count}))$(id).value=v;$('count-row').hidden=a.type!=='group'}updateSummary()}
function boardSize(w,h){W=w;H=h;const maxWidth=Math.max(240,document.querySelector('.board-wrap').clientWidth-32);scale=Math.min(1,maxWidth/W);stage.size({width:Math.round(W*scale),height:Math.round(H*scale)});stage.scale({x:scale,y:scale});bg.size({width:W,height:H});layer.draw();guideLayer.draw();updateSummary()}
function pointer(){const p=stage.getPointerPosition();return{x:p.x/scale,y:p.y/scale}}stage.on('mousedown touchstart',e=>{if(e.target!==bg&&e.target!==stage)return;start=pointer();marquee.setAttrs({x:start.x,y:start.y,width:0,height:0,visible:true});guideLayer.draw()});stage.on('mousemove touchmove',()=>{if(!start)return;const p=pointer();marquee.setAttrs({x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),width:Math.abs(p.x-start.x),height:Math.abs(p.y-start.y)});guideLayer.batchDraw()});stage.on('mouseup touchend',()=>{if(!start)return;const rect=marquee.getAttrs(),isDrag=rect.width>3||rect.height>3;if(isDrag){const hits=layer.find('.item').filter(n=>Konva.Util.haveIntersection(marquee.getClientRect({relativeTo:layer}),n.getClientRect({relativeTo:layer})));setSelected(hits)}else setSelected([]);start=null;marquee.visible(false);guideLayer.draw()});
const defaults={frame:{width:300,height:160,fill:'#ffffff',color:'#273d4c',stroke:'#aebfc7',radius:12,fontSize:16,label:'功能区'},button:{width:100,height:44,fill:'#526a91',color:'#ffffff',stroke:'#526a91',radius:22,fontSize:15,label:'按钮'},group:{width:230,height:46,fill:'#ffffff',color:'#273d4c',stroke:'#526a91',radius:23,fontSize:15,label:'主线,并行',count:2},text:{width:180,height:40,fill:'#ffffff',color:'#273d4c',stroke:'#ffffff',radius:0,fontSize:18,label:'双击后在右侧修改文字'},chart:{width:180,height:180,fill:'#526a91',color:'#273d4c',stroke:'#dce5ed',radius:0,fontSize:14,label:'24 小时'},icon:{width:50,height:50,fill:'#ffffff',color:'#273d4c',stroke:'#526a91',radius:0,fontSize:14,label:''}};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const type=b.dataset.add,g=make({type,...defaults[type],x:Math.max(10,(W-defaults[type].width)/2),y:40+layer.find('.item').length*25});setSelected([g])});$('selectAll').onclick=()=>setSelected(Array.from(layer.find('.item')));$('delete').onclick=()=>{selected.forEach(n=>n.destroy());setSelected([])};for(const id of ['name','label','x','y','width','height','fill','color','stroke','radius','fontSize','count'])$(id).addEventListener('input',()=>{if(selected.length!==1)return;const g=selected[0];let v=$(id).value;if(['x','y','width','height','radius','fontSize','count'].includes(id)){if(v==='')return;v=Number(v);if(!Number.isFinite(v))return;if(['width','height'].includes(id))v=Math.max(20,v)}g.setAttr(id==='name'?'itemName':id,v);render(g);transformer.forceUpdate();layer.batchDraw();updateSummary()});
$('device').onchange=()=>{if($('device').value==='custom')return;const [w,h]=$('device').value.split(',').map(Number);$('boardW').value=w;$('boardH').value=h;boardSize(w,h)};$('resize').onclick=()=>{const w=Number($('boardW').value),h=Number($('boardH').value);if(w<240||w>1600||h<240||h>2400){$('status').textContent='宽度需在 240–1600，高度需在 240–2400。';return}$('device').value='custom';boardSize(w,h)};window.addEventListener('resize',()=>boardSize(W,H));$('copy').onclick=async()=>{if(!selected.length){$('status').textContent='请先选择内容。';return}try{await navigator.clipboard.writeText($('summary').value);$('status').textContent='已复制，可以发给 AI。'}catch(e){$('summary').focus();$('summary').select();$('status').textContent='请手动复制已选中的文字。'}};$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({W,H,items:layer.find('.item').map(n=>n.getAttrs())}));$('status').textContent='草稿已保存在本浏览器。'}catch(e){$('status').textContent='保存失败，请检查浏览器存储。'}};$('clear').onclick=()=>{if(confirm('清空画板上的所有元素？已保存的草稿不会立即清除。')){layer.find('.item').forEach(n=>n.destroy());setSelected([])}};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.items)){W=saved.W||W;H=saved.H||H;$('boardW').value=W;$('boardH').value=H;$('device').value='custom';saved.items.forEach(d=>make(d));}}catch(e){$('status').textContent='草稿读取失败，显示空白画板。'}boardSize(W,H);refresh();})();</script></body></html>
