</style></head><body><header><h1>统一设计工作台 <small>· 第一稿</small></h1><a href="studio.html">原设计原型</a><a href="canvas.html">原自由画布</a><button id="save">保存草稿</button><button id="reset">新建空白</button></header>
<div class="layout"><aside class="side left"><h2>添加画板</h2><label for="device" class="hint">选择手机参考尺寸（逻辑像素）</label><select id="device" class="preset"><option value="384,832">S24 Ultra 参考 · 384 × 832</option><option value="360,780">窄屏手机 · 360 × 780</option><option value="390,844">常见手机 · 390 × 844</option><option value="412,915">宽屏手机 · 412 × 915</option><option value="custom">自定义尺寸</option></select><div id="customSize" hidden><input id="customW" type="number" value="384" min="240" max="1200" aria-label="自定义画板宽度" style="width:48%"> × <input id="customH" type="number" value="832" min="240" max="2000" aria-label="自定义画板高度" style="width:42%"></div><button class="preset" id="addBoard">＋ 添加手机画板</button><p class="hint">可以添加多个画板，对照不同方案。</p><h2>添加模块</h2><div class="modules"><button data-add="frame">外框</button><button data-add="button">按钮</button><button data-add="group">按钮组</button><button data-add="text">文字</button><button data-add="chart">圆环图</button><button data-add="icon">图标</button></div><p class="hint">先选择一个画板，再添加模块。双击画板名称区域可选中画板。</p><h2>画板与元素</h2><div id="layers" class="layers"></div><p class="hint">点选对象；空白处拖动框选，碰到即选中。Shift 点击可增减选择。</p></aside>
<main class="canvas"><div class="tools"><button id="designMode">设计模式</button><button id="previewMode">交互预览</button><button id="selectAll">全选元素</button><button id="remove">删除所选</button><button id="zoomOut">−</button><span id="zoomLabel">70%</span><button id="zoomIn">＋</button></div><div class="viewport" id="viewport"><div id="canvas"></div></div><p class="hint">画布可以滚动；移动元素靠近边缘或其他元素时会出现对齐线。预览模式可点击按钮组切换选中项。</p></main>
<aside class="side right"><h2>选中内容的设置</h2><p id="selection" class="picked">请选择画板或元素</p><div id="fields" class="fields" hidden><details open><summary>内容与尺寸</summary><label>名称<input id="itemName"></label><label id="labelRow">文字<input id="label"></label><label>左边位置<input type="number" id="x"></label><label>上边位置<input type="number" id="y"></label><label>宽度<input type="number" min="20" max="1600" id="width"></label><label>高度<input type="number" min="20" max="2400" id="height"></label><label id="countRow" hidden>按钮数量<select id="count"><option>2</option><option>3</option><option>4</option></select></label></details><details open id="appearance"><summary>外观与文字</summary><label>背景颜色<input type="color" id="fill"></label><label>文字颜色<input type="color" id="color"></label><label>边框颜色<input type="color" id="stroke"></label><label>圆角<input type="number" min="0" max="999" id="radius"></label><label>字号<input type="number" min="8" max="100" id="fontSize"></label><span class="hint">常用形状</span><div class="colorline"><button data-radius="0">直角</button><button data-radius="8">小圆角</button><button data-radius="16">大圆角</button><button data-radius="999">胶囊</button></div></details></div><p id="multi" hidden class="hint">多选时可一起移动，也可以复制所选内容。</p><h2>所选设计参数</h2><textarea id="summary" class="summary" readonly aria-label="所选设计参数"></textarea><button id="copy" class="copy">复制所选参数给 AI</button><p class="status" id="status" role="status"></p><p class="hint note">第一稿：画板与元素有归属关系；外框还不能嵌套元素，图表和图标是示例，暂未导入真实 App 界面。</p></aside></div>

(()=>{'use strict';const $=x=>document.getElementById(x),key='timebook-unified-workspace-v1';const sceneW=2200,sceneH=1600;let zoom=.7,selection=[],activeBoard=null,preview=false,marqueeStart=null,dragStart=null,counter=0;const stage=new Konva.Stage({container:'canvas',width:sceneW*zoom,height:sceneH*zoom}),layer=new Konva.Layer(),overlay=new Konva.Layer({listening:false});stage.scale({x:zoom,y:zoom});stage.add(layer,overlay);const canvasBg=new Konva.Rect({width:sceneW,height:sceneH,fill:'#e5edf0',name:'canvas-bg'});layer.add(canvasBg);const transformer=new Konva.Transformer({rotateEnabled:false,anchorSize:8,borderStroke:'#428aab',anchorStroke:'#428aab',boundBoxFunc:(old,b)=>b.width<20||b.height<20?old:b});layer.add(transformer);const marquee=new Konva.Rect({fill:'rgba(57,139,184,.14)',stroke:'#3d8ab2',strokeWidth:1,visible:false,listening:false});overlay.add(marquee);
const types={board:'手机画板',frame:'功能区外框',button:'按钮',group:'按钮组',text:'文字',chart:'圆环图',icon:'图标'};const defaults={frame:{width:280,height:140,fill:'#ffffff',color:'#273d4c',stroke:'#b8c8ce',radius:12,fontSize:16,label:'功能区'},button:{width:100,height:44,fill:'#526a91',color:'#ffffff',stroke:'#526a91',radius:22,fontSize:15,label:'按钮'},group:{width:230,height:46,fill:'#ffffff',color:'#273d4c',stroke:'#526a91',radius:23,fontSize:15,label:'主线,并行',count:2,active:0},text:{width:180,height:36,fill:'#ffffff',color:'#273d4c',stroke:'#ffffff',radius:0,fontSize:18,label:'文字'},chart:{width:180,height:180,fill:'#526a91',color:'#273d4c',stroke:'#dce5ed',radius:0,fontSize:14,label:'24 小时'},icon:{width:48,height:48,fill:'#ffffff',color:'#273d4c',stroke:'#526a91',radius:0,fontSize:14,label:''}};
function boards(){return Array.from(layer.find('.board'))}function items(){return Array.from(layer.find('.item'))}function parentBoard(n){return n.hasName('board')?n:n.findAncestor('.board')}function coords(){let p=stage.getPointerPosition();return{x:p.x/zoom,y:p.y/zoom}}function setZoom(n){zoom=Math.max(.3,Math.min(1.5,n));stage.size({width:sceneW*zoom,height:sceneH*zoom});stage.scale({x:zoom,y:zoom});$('zoomLabel').textContent=Math.round(zoom*100)+'%';stage.draw()}
function redrawBoard(b){const back=b.findOne('.board-bg'),title=b.findOne('.board-title');back.size({width:b.width(),height:b.height()});title.text(b.getAttr('itemName')+'  ·  '+Math.round(b.width())+' × '+Math.round(b.height()));title.width(Math.max(180,b.width()));}
function addBoard(d){const b=new Konva.Group({name:'board',id:d.id||'board-'+Date.now()+'-'+(++counter),itemName:d.itemName||'手机画板 '+(boards().length+1),x:d.x??(70+boards().length*460),y:d.y??90,width:d.width,height:d.height,draggable:false});b.add(new Konva.Rect({name:'board-bg',width:d.width,height:d.height,fill:'#ffffff',shadowColor:'#4b6670',shadowBlur:8,shadowOpacity:.15}));b.add(new Konva.Text({name:'board-title',x:0,y:-26,width:d.width,height:24,text:'',fontSize:13,fill:'#435e6d',draggable:!preview}));layer.add(b);redrawBoard(b);const title=b.findOne('.board-title');let boardDrag=null;title.on('dragstart',e=>{e.cancelBubble=true;boardDrag={x:b.x(),y:b.y()};setSelection([b])});title.on('dragmove',e=>{e.cancelBubble=true;if(boardDrag){b.position({x:boardDrag.x+title.x(),y:boardDrag.y+title.y()+26});title.position({x:0,y:-26});boardDrag={x:b.x(),y:b.y()};refresh()}});title.on('dragend',e=>{e.cancelBubble=true;boardDrag=null;refresh()});b.on('mousedown touchstart',e=>{if(e.target.hasName('board-bg')){activeBoard=b;updateLayers()}});b.on('dblclick dbltap',e=>{e.cancelBubble=true;setSelection([b])});b.on('click tap',e=>{if(e.target.hasName('board-title')){e.cancelBubble=true;setSelection([b])}});b.on('dragstart',e=>{if(e.target!==b)return;setSelection([b])});b.on('dragend',e=>{if(e.target===b)refresh()});activeBoard=b;transformer.moveToTop();updateLayers();return b}
function drawItem(g){g.destroyChildren();const d=g.getAttrs(),w=g.width(),h=g.height();if(d.type==='chart'){g.add(new Konva.Circle({x:w/2,y:h/2,radius:Math.min(w,h)*.38,stroke:'#dce5ed',strokeWidth:Math.min(w,h)*.19}));g.add(new Konva.Arc({x:w/2,y:h/2,innerRadius:Math.min(w,h)*.285,outerRadius:Math.min(w,h)*.475,angle:125,rotation:-90,fill:d.fill}));g.add(new Konva.Text({x:0,y:h/2-d.fontSize/2,width:w,text:d.label,align:'center',fontSize:d.fontSize,fill:d.color}));}else if(d.type==='icon'){g.add(new Konva.Circle({x:w/2,y:h/2,radius:Math.min(w,h)*.32,stroke:d.stroke,strokeWidth:2}));g.add(new Konva.Line({points:[w/2,h*.28,w/2,h/2,w*.66,h*.58],stroke:d.stroke,strokeWidth:2,lineCap:'round'}));}else{g.add(new Konva.Rect({width:w,height:h,fill:d.fill,stroke:d.stroke,strokeWidth:1,cornerRadius:Math.min(d.radius,Math.min(w,h)/2)}));if(d.type==='group'){const n=d.count||2,part=(w-8-(n-1)*4)/n;for(let i=0;i<n;i++){const x=4+i*(part+4);if(i===(d.active||0))g.add(new Konva.Rect({x,y:4,width:part,height:h-8,fill:'#526a91',cornerRadius:Math.min(d.radius,(h-8)/2)}));g.add(new Konva.Text({x,y:h/2-d.fontSize/2,width:part,text:(d.label||'').split(/[,，]/)[i]||'选项'+(i+1),fontSize:d.fontSize,align:'center',fill:i===(d.active||0)?'#fff':d.color}));}}else g.add(new Konva.Text({x:5,y:Math.max(0,(h-d.fontSize)/2),width:w-10,text:d.label||'',fontSize:d.fontSize,align:d.type==='frame'?'left':'center',fill:d.color}));}}
function addItem(b,d){const g=new Konva.Group({name:'item',id:d.id||'item-'+Date.now()+'-'+(++counter),type:d.type,itemName:d.itemName||types[d.type],x:d.x??30,y:d.y??40,width:d.width,height:d.height,fill:d.fill,color:d.color,stroke:d.stroke,radius:d.radius,fontSize:d.fontSize,label:d.label||'',count:d.count||2,active:d.active||0,draggable:!preview});b.add(g);drawItem(g);g.on('mousedown touchstart',e=>{e.cancelBubble=true});g.on('click tap',e=>{e.cancelBubble=true;if(preview){if(g.getAttr('type')==='group'){let p=g.getRelativePointerPosition(),n=g.getAttr('count'),idx=Math.floor(p.x/(g.width()/n));g.setAttr('active',Math.max(0,Math.min(n-1,idx)));drawItem(g);layer.draw()}return}if(e.evt.shiftKey)setSelection(selection.includes(g)?selection.filter(v=>v!==g):[...selection,g]);else if(!selection.includes(g))setSelection([g])});g.on('dragstart',e=>{e.cancelBubble=true;if(!selection.includes(g))setSelection([g]);dragStart=selection.filter(n=>n.hasName('item')&&parentBoard(n)===b).map(n=>({n,x:n.x(),y:n.y()}))});g.on('dragmove',e=>{e.cancelBubble=true;if(!dragStart)return;const origin=dragStart.find(o=>o.n===g);if(!origin)return;let dx=g.x()-origin.x,dy=g.y()-origin.y;dragStart.forEach(o=>{if(o.n!==g)o.n.position({x:o.x+dx,y:o.y+dy})});if(dragStart.length===1)snap(g,b);updateSummary()});g.on('dragend',e=>{e.cancelBubble=true;dragStart=null;overlay.find('.guide').forEach(n=>n.destroy());overlay.draw();refresh()});g.on('transformend',()=>{g.width(Math.max(20,g.width()*g.scaleX()));g.height(Math.max(20,g.height()*g.scaleY()));g.scale({x:1,y:1});drawItem(g);refresh()});transformer.moveToTop();updateLayers();return g}
function snap(g,b){overlay.find('.guide').forEach(n=>n.destroy());let tx=[0,b.width()/2,b.width()],ty=[0,b.height()/2,b.height()];b.find('.item').forEach(n=>{if(n!==g){tx.push(n.x(),n.x()+n.width()/2,n.x()+n.width());ty.push(n.y(),n.y()+n.height()/2,n.y()+n.height())}});for(const [axis,targets,size] of [['x',tx,g.width()],['y',ty,g.height()]]){let best=null;for(const t of targets)for(const off of [0,size/2,size]){let delta=t-g[axis]()-off;if(Math.abs(delta)<5/zoom&&(!best||Math.abs(delta)<Math.abs(best.delta)))best={t,delta}}if(best){g[axis](g[axis]()+best.delta);const t=best.t;overlay.add(new Konva.Line({name:'guide',points:axis==='x'?[b.x()+t,b.y(),b.x()+t,b.y()+b.height()]:[b.x(),b.y()+t,b.x()+b.width(),b.y()+t],stroke:'#e26ca7',strokeWidth:1/zoom,dash:[4,3]}))}}overlay.batchDraw()}
function updateLayers(){const list=$('layers');list.replaceChildren();boards().forEach(b=>{const button=document.createElement('button');button.textContent=(b===activeBoard?'● ':'○ ')+b.getAttr('itemName')+' · '+b.find('.item').length+' 项';button.className=b===activeBoard?'active':'';button.onclick=()=>setSelection([b]);list.append(button)})}
function setSelection(a){selection=a;if(a.length)activeBoard=parentBoard(a[0]);transformer.nodes(preview?[]:a.filter(n=>!n.hasName('board')));updateLayers();refresh();layer.batchDraw()}
function summaryData(n){const a=n.getAttrs(),b=parentBoard(n);if(n.hasName('board'))return {类型:'手机画板',名称:a.itemName,位置:{左:Math.round(n.x()),上:Math.round(n.y())},尺寸:{宽:Math.round(n.width()),高:Math.round(n.height())},内容:Array.from(n.find('.item')).map(summaryData)};return {类型:types[a.type],名称:a.itemName,所属画板:b?.getAttr('itemName'),相对画板位置:{左:Math.round(n.x()),上:Math.round(n.y())},尺寸:{宽:Math.round(n.width()*n.scaleX()),高:Math.round(n.height()*n.scaleY())},文字:a.label,按钮数量:a.type==='group'?a.count:undefined,背景:a.fill,文字颜色:a.color,边框颜色:a.stroke,圆角:a.radius,字号:a.fontSize}}

function refresh(){let one=selection.length===1,n=selection[0];$('selection').textContent=selection.length?'已选 '+selection.length+' 项'+(one?'：'+n.getAttr('itemName'):''):'请选择画板或元素';$('fields').hidden=!one;$('multi').hidden=selection.length<2;if(one){let a=n.getAttrs(),isBoard=n.hasName('board');$('appearance').hidden=isBoard;$('labelRow').hidden=isBoard;$('countRow').hidden=isBoard||a.type!=='group';for(const [id,val] of Object.entries({itemName:a.itemName,label:a.label||'',x:Math.round(n.x()),y:Math.round(n.y()),width:Math.round(n.width()),height:Math.round(n.height()),fill:a.fill||'#ffffff',color:a.color||'#273d4c',stroke:a.stroke||'#526a91',radius:a.radius||0,fontSize:a.fontSize||14,count:a.count||2}))$(id).value=val}updateSummary()}

$('device').onchange=()=>{$('customSize').hidden=$('device').value!=='custom'};$('addBoard').onclick=()=>{let wh=$('device').value==='custom'?[Number($('customW').value),Number($('customH').value)]:$('device').value.split(',').map(Number);if(wh[0]<240||wh[0]>1200||wh[1]<240||wh[1]>2000){$('status').textContent='宽度范围 240–1200，高度范围 240–2000。';return}setSelection([addBoard({width:wh[0],height:wh[1]})]);$('status').textContent='已添加手机画板。'};document.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{if(!activeBoard){$('status').textContent='请先添加或选择一个手机画板。';return}let type=btn.dataset.add,g=addItem(activeBoard,{type,...defaults[type],x:Math.max(10,(activeBoard.width()-defaults[type].width)/2),y:40+activeBoard.find('.item').length*25});setSelection([g]);$('status').textContent='已添加'+types[type]});

$('selectAll').onclick=()=>setSelection(activeBoard?Array.from(activeBoard.find('.item')):items());$('remove').onclick=()=>{if(!selection.length)return;if(selection.some(n=>n.hasName('board'))&&!confirm('删除画板也会删除其中的元素，确定吗？'))return;selection.forEach(n=>n.destroy());if(activeBoard&&!boards().includes(activeBoard))activeBoard=boards()[0]||null;setSelection([])};function mode(on){preview=on;items().forEach(n=>n.draggable(!on));boards().forEach(n=>n.findOne('.board-title').draggable(!on));transformer.nodes([]);if(!on)transformer.nodes(selection.filter(n=>!n.hasName('board')));$('status').textContent=on?'交互预览：点击按钮组切换选中项。':'设计模式：可移动和编辑。';layer.draw()}$('designMode').onclick=()=>mode(false);$('previewMode').onclick=()=>mode(true);$('zoomOut').onclick=()=>setZoom(zoom-.1);$('zoomIn').onclick=()=>setZoom(zoom+.1);
$('copy').onclick=async()=>{if(!selection.length){$('status').textContent='请先选择画板或元素。';return}try{await navigator.clipboard.writeText($('summary').value);$('status').textContent='已复制，可发送给 AI。'}catch(e){$('summary').focus();$('summary').select();$('status').textContent='请手动复制已选中的文字。'}};function serialize(){return boards().map(b=>({id:b.id(),itemName:b.getAttr('itemName'),x:b.x(),y:b.y(),width:b.width(),height:b.height(),children:Array.from(b.find('.item')).map(g=>({...g.getAttrs()}))}))}$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({boards:serialize()}));$('status').textContent='草稿已保存到本浏览器。'}catch(e){$('status').textContent='保存失败，请检查浏览器存储。'}};$('reset').onclick=()=>{if(confirm('新建空白将清除当前画布内容；已保存的草稿不会立即删除。继续吗？')){boards().forEach(b=>b.destroy());activeBoard=null;setSelection([]);layer.draw()}};
try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.boards))saved.boards.forEach(data=>{let b=addBoard(data);(data.children||[]).forEach(d=>addItem(b,d))})}catch(e){$('status').textContent='草稿读取失败，请检查浏览器存储。'}updateLayers();refresh();stage.draw();})();
</script></body></html>
